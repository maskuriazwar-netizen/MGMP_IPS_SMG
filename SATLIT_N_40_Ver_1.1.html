<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satuan Literasi dan Numerasi — SMPN 40 Semarang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FE;
  --surface:#FFFFFF;
  --surface-2:#EEF1FD;
  --ink:#1E2148;
  --muted:#6D71A0;
  --line:#E1E4F5;
  --accent:#FF6B4A;
  --accent2:#FFB238;
  --accent3:#5B8DEF;
  --accent4:#22C08C;
  --accent5:#B15BEF;
  --accent-ink:#FFFFFF;
  --ok:#1FAE6E;
  --danger:#E5484D;
  --radius:18px;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
h1,h2,h3,.disp{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

.app{max-width:1000px;margin:0 auto;padding:0 20px 80px;}

/* HERO */
.hero{
  position:relative;padding:44px 24px 30px;margin:0 -20px 18px;
  background:
    radial-gradient(circle at 8% 12%, rgba(255,107,74,.24), transparent 38%),
    radial-gradient(circle at 92% 5%, rgba(91,141,239,.24), transparent 42%),
    radial-gradient(circle at 78% 85%, rgba(177,91,239,.18), transparent 40%),
    radial-gradient(circle at 25% 95%, rgba(34,192,140,.20), transparent 40%),
    radial-gradient(circle at 50% 40%, rgba(255,178,56,.14), transparent 55%),
    linear-gradient(180deg,#FFFFFF,#F5F7FE 88%);
  border-bottom:3px solid transparent;
  border-image:linear-gradient(90deg,var(--accent),var(--accent2),var(--accent4),var(--accent3),var(--accent5)) 1;
}
.hero-inner{display:flex;align-items:center;gap:32px;}
.hero-text{flex:1.2;min-width:0;}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);}
.hero h1{font-size:clamp(22px,3.6vw,32px);line-height:1.18;margin:10px 0 8px;font-weight:700;letter-spacing:-.01em;}
.hero p{color:var(--muted);max-width:520px;margin:0 0 18px;font-size:15px;line-height:1.6;}
.hero-stats{display:flex;gap:10px;flex-wrap:wrap;}
.stat{border:1px solid transparent;border-radius:14px;padding:10px 16px;min-width:100px;}
.stat b{font-family:'Space Grotesk';font-size:20px;display:block;}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.stat:nth-child(1){background:rgba(255,107,74,.12);border-color:rgba(255,107,74,.25);}
.stat:nth-child(1) b{color:#D9421C;}
.stat:nth-child(2){background:rgba(34,192,140,.12);border-color:rgba(34,192,140,.28);}
.stat:nth-child(2) b{color:#0E8E63;}
.stat:nth-child(3){background:rgba(91,141,239,.12);border-color:rgba(91,141,239,.28);}
.stat:nth-child(3) b{color:#2E5FC9;}

/* HERO VISUAL / COVER */
.hero-visual{flex:none;min-width:180px;max-width:190px;position:relative;display:flex;align-items:center;justify-content:center;}
.logo-card{
  width:100%;aspect-ratio:1;border-radius:22px;position:relative;
  background:#fff;border:3px solid transparent;box-shadow:0 18px 40px -18px rgba(30,33,72,.35);
  display:flex;align-items:center;justify-content:center;padding:16px;
  background-image:linear-gradient(#fff,#fff), linear-gradient(135deg,var(--accent),var(--accent2),var(--accent3));
  background-origin:border-box;background-clip:padding-box, border-box;
}
.logo-card img{width:100%;height:100%;object-fit:contain;}
@media(max-width:720px){
  .hero-inner{flex-direction:column-reverse;align-items:stretch;gap:22px;}
  .hero-visual{max-width:150px;margin:0 auto;}
  .hero-text p{max-width:none;}
}

/* PROFILE GATE */
.gate{
  max-width:420px;margin:0 auto 22px;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);padding:28px 26px;text-align:center;
  box-shadow:0 18px 40px -22px rgba(30,33,72,.3);
}
.gate-emoji{font-size:30px;margin-bottom:6px;}
.gate h3{margin:0 0 6px;font-size:19px;}
.gate p{color:var(--muted);font-size:13.5px;margin:0 0 18px;line-height:1.5;}
.gate label{display:block;text-align:left;font-size:12.5px;color:var(--muted);margin:0 0 6px;font-weight:600;}
.gate-input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#FAFBFF;color:var(--ink);font-size:14.5px;margin-bottom:14px;font-family:inherit;}
.gate .btnrow{justify-content:center;margin-top:6px;}

/* PROFILE PILL */
.profile-pill{
  display:flex;align-items:center;gap:12px;background:linear-gradient(90deg, rgba(255,107,74,.06), rgba(91,141,239,.06));
  border:1px solid var(--line);
  border-radius:14px;padding:10px 14px;margin-bottom:16px;
}
.profile-pill .avatar{
  width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent5));color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:15px;flex:none;
}
.profile-pill .pinfo{flex:1;min-width:0;}
.profile-pill .pinfo b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.profile-pill .pinfo span{font-size:12px;color:var(--muted);}
.profile-pill .pedit{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;flex:none;}

/* NAV */
.tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px;margin-bottom:22px;}
.tab{flex:1;text-align:center;padding:10px 8px;border-radius:10px;border:none;background:transparent;color:var(--muted);font-weight:600;font-size:13.5px;transition:.15s;}
.tab.active{background:linear-gradient(120deg,var(--accent),var(--accent5));color:#fff;box-shadow:0 8px 18px -8px rgba(255,107,74,.5);}

/* PASSPORT GRID */
.section-title{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 12px;padding-left:12px;position:relative;}
.section-title::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:5px;border-radius:4px;background:linear-gradient(180deg,var(--accent),var(--accent3));}
.section-title h2{font-size:18px;margin:0;}
.section-title span{color:var(--muted);font-size:12.5px;}

.passport{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;}
.stamp{
  aspect-ratio:1;border-radius:50%;border:2px dashed #D7D1F5;
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  font-family:'Space Grotesk';font-weight:700;font-size:13px;color:var(--muted);
  background:#FAF9FF;position:relative;transition:.15s;
}
.stamp.unlocked{border-style:solid;border-width:2.5px;border-color:var(--themecolor,#555);color:var(--ink);background:#fff;}
.stamp.done{background:var(--themecolor,#555);border-color:var(--themecolor,#555);color:#1E2148;box-shadow:0 6px 16px -6px var(--themecolor,#555);}
.stamp.locked{opacity:.5;cursor:not-allowed;}
.stamp:not(.locked):hover{transform:translateY(-3px) scale(1.05);}
.stamp small{font-size:8.5px;font-weight:500;opacity:.85;}

/* CARDS / LIST */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;}
.chip.active{color:#1E2148;border-color:transparent;}

.edlist{display:flex;flex-direction:column;gap:8px;}
.edrow{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
.edrow .badge{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';font-weight:700;font-size:13px;color:#1E2148;}
.edrow .meta{flex:1;min-width:0;}
.edrow .meta b{display:block;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.edrow .meta span{font-size:12px;color:var(--muted);}
.edrow .status{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;}
.st-done{background:rgba(74,222,128,.15);color:var(--ok);}
.st-open{background:rgba(255,107,74,.12);color:var(--accent);}
.st-lock{background:rgba(30,33,72,.05);color:var(--muted);}

/* READER */
.reader{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:26px 24px;}
.reader-img{width:100%;border-radius:14px;overflow:hidden;margin:0 0 18px;box-shadow:0 14px 30px -18px rgba(30,33,72,.35);background:#F2F3FC;}
.reader-img svg{display:block;width:100%;height:auto;}
.sound-toggle{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:9px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:5px;}
.reader .tag{display:inline-block;padding:5px 12px;border-radius:999px;font-size:11.5px;font-weight:700;color:#1E2148;margin-bottom:12px;}
.reader h2{font-size:24px;margin:0 0 4px;}
.reader .sub{color:var(--muted);font-size:13px;margin-bottom:18px;}
.reader p{line-height:1.85;font-size:15.5px;color:#3D4070;margin:0 0 16px;}
.divider{border:none;border-top:2px dashed #E7CFFB;margin:24px 0;}
.q-block{margin-bottom:22px;}
.q-block .qlabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;margin-bottom:8px;}
.q-text{font-weight:600;font-size:15px;margin-bottom:10px;}
.opts{display:flex;flex-direction:column;gap:8px;}
.opt{text-align:left;padding:11px 14px;border:1px solid var(--line);background:#FAFBFF;border-radius:12px;font-size:14px;color:var(--ink);}
.opt.sel{border-color:var(--accent);background:rgba(255,107,74,.08);}
.opt.correct{border-color:var(--ok);background:rgba(74,222,128,.12);}
.opt.wrong{border-color:var(--danger);background:rgba(248,113,113,.12);}
.numin{width:160px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:#FAFBFF;color:var(--ink);font-size:15px;}
.refl textarea{width:100%;min-height:64px;border-radius:12px;border:1px solid var(--line);background:#FAFBFF;color:var(--ink);padding:11px 14px;font-size:14px;font-family:inherit;resize:vertical;}
.refl label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px;}
.btnrow{display:flex;gap:10px;margin-top:22px;}
.btn{padding:12px 22px;border-radius:12px;border:none;font-weight:700;font-size:14px;background:linear-gradient(120deg,var(--accent),var(--accent2));color:var(--accent-ink);box-shadow:0 10px 20px -10px rgba(255,107,74,.6);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn:disabled{opacity:.4;cursor:not-allowed;}
.result{margin-top:20px;padding:16px;border-radius:14px;background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.3);}
.result b{font-family:'Space Grotesk';font-size:22px;color:var(--ok);}
.lockmsg{text-align:center;padding:50px 20px;color:var(--muted);}
.lockmsg .emoji{font-size:34px;display:block;margin-bottom:10px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--line);padding:12px 20px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(30,33,72,.15);z-index:50;}
.footer-note{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.reset-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:5px 12px;border-radius:8px;font-size:11.5px;}
@media(max-width:560px){.hero{padding:32px 18px 22px;}.reader{padding:20px 16px;}}
</style>
</head>

/* ---------------- VOICE FEEDBACK (Text-to-Speech) ---------------- */
let SOUND_ON = true;
let hasGreetedThisSession = false;
function speak(text){
  if(!SOUND_ON) return;
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'id-ID';
    u.rate = 0.98;
    u.pitch = 1.05;
    const voices = window.speechSynthesis.getVoices();
    const idVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('id'));
    if(idVoice) u.voice = idVoice;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
function praiseForScore(score){
  if(score===100) return pick(['Sempurna! Kamu hebat sekali!','Wah, seratus persen! Luar biasa!','Excellent! Nilai sempurna!']);
  if(score>=70) return pick(['Bagus sekali, kerja bagus!','Hebat, pertahankan ya!','Kerja bagus, terus semangat!']);
  return pick(['Terima kasih sudah mengerjakan, ayo terus semangat belajar!','Bagus, jangan menyerah ya, terus berlatih!','Terima kasih sudah berusaha, yuk terus belajar!']);
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

3:{ theme:'sains', title:'Kenapa Langit Berwarna Biru?',
  paras:[
   'Cahaya matahari yang tampak putih sebenarnya tersusun dari berbagai warna, seperti yang terlihat pada pelangi: merah, jingga, kuning, hijau, biru, nila, dan ungu. Ketika cahaya ini memasuki atmosfer bumi, ia menabrak molekul-molekul gas seperti nitrogen dan oksigen yang jumlahnya sangat banyak di udara.',
   'Setiap warna cahaya memiliki panjang gelombang yang berbeda. Warna biru memiliki panjang gelombang pendek, sehingga lebih mudah dihamburkan ke segala arah oleh molekul udara dibandingkan warna merah yang panjang gelombangnya lebih panjang. Peristiwa ini disebut hamburan Rayleigh, dinamai dari ilmuwan yang pertama kali menjelaskannya secara matematis.',
   'Karena cahaya biru dihamburkan jauh lebih banyak, warna inilah yang paling banyak sampai ke mata kita dari segala penjuru langit, sehingga langit tampak biru sepanjang siang hari. Fenomena yang sama juga menjelaskan mengapa langit berubah menjadi jingga dan merah saat matahari terbenam: cahaya matahari harus menembus lapisan atmosfer yang lebih tebal, sehingga warna biru sudah terhambur habis sebelum sampai ke mata kita, dan yang tersisa adalah warna jingga-merah.',

4:{ theme:'sejarah', title:'Sumpah Pemuda dan Persatuan Bahasa',
  paras:[
   'Pada 28 Oktober 1928, ratusan pemuda dari berbagai daerah dan organisasi kedaerahan berkumpul dalam Kongres Pemuda II di Batavia (sekarang Jakarta). Mereka datang dari latar belakang suku, agama, dan bahasa daerah yang sangat beragam, namun memiliki satu cita-cita yang sama: sebuah Indonesia yang merdeka dan bersatu.',

5:{ theme:'budaya', title:'Batik, Warisan yang Mendunia',
  paras:[

/* ---------------- BUILD 102 EDITIONS ---------------- */
const TOTAL_WEEKS = 102;
const EDITIONS = [];
for(let w=1; w<=TOTAL_WEEKS; w++){
  const themeIdx = (w-1) % THEMES.length;
  const theme = THEMES[themeIdx];
  const authored = CONTENT[w];
  EDITIONS.push({
    week:w,
    themeId: theme.id,
    title: authored ? authored.title : ('Edisi Minggu '+w+' — '+theme.name+' (segera hadir)'),
    draft: !authored,
    content: authored || null
  });
}

/* ---------------- STORAGE ---------------- */
const STORE_KEY = 'satlit40-progress';
const PROFILE_KEY = 'satlit40-profile';
let PROGRESS = {}; // { [week]: {done:true, score:0-100, reflections:[...]} }
let PROFILE = null; // { nama, kelas }
let editingProfile = false;
let currentTab = 'beranda';
let currentFilter = 'all';
let openWeek = null;
let quizState = {};

async function loadProgress(){
  try{
    const r = await window.storage.get(STORE_KEY);
    PROGRESS = r && r.value ? JSON.parse(r.value) : {};
  }catch(e){ PROGRESS = {}; }
}
async function saveProgress(){
  try{ await window.storage.set(STORE_KEY, JSON.stringify(PROGRESS)); }catch(e){}
}
async function loadProfile(){
  try{
    const r = await window.storage.get(PROFILE_KEY);
    PROFILE = r && r.value ? JSON.parse(r.value) : null;
  }catch(e){ PROFILE = null; }
}
async function saveProfile(nama, kelas){
  PROFILE = { nama: nama.trim(), kelas: kelas.trim() };
  try{ await window.storage.set(PROFILE_KEY, JSON.stringify(PROFILE)); }catch(e){}
}
function isUnlocked(week){
  // Semua edisi/tema dibuka langsung, tidak perlu menyelesaikan minggu sebelumnya dulu.
  return true;
}
function isDone(week){ return !!(PROGRESS[week] && PROGRESS[week].done); }

/* ---------------- RENDER HELPERS ---------------- */
function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstElementChild; }
function hexToRgba(hex, a){
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba('+r+','+g+','+b+','+a+')';
}
function showToast(msg){
  const t = el('<div class="toast">'+msg+'</div>');
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}
function avgScore(){
  const done = Object.values(PROGRESS).filter(p=>p.done);
  if(!done.length) return 0;
  return Math.round(done.reduce((a,p)=>a+p.score,0)/done.length);
}
function doneCount(){ return Object.values(PROGRESS).filter(p=>p.done).length; }

/* ---------------- VIEWS ---------------- */
function renderApp(){
  const app = document.getElementById('app');
  app.innerHTML = '';
  app.appendChild(renderHero());
  if(!PROFILE || editingProfile){
    app.appendChild(renderProfileGate());
    return;
  }
  app.appendChild(renderProfilePill());
  app.appendChild(renderTabs());
  if(openWeek){ app.appendChild(renderReader(openWeek)); }
  else if(currentTab==='beranda'){ app.appendChild(renderBeranda()); }
  else { app.appendChild(renderDaftar()); }
  app.appendChild(renderFooter());
}

function renderProfileGate(){
  const wrap = el(`
  <div class="gate">
    <div class="gate-emoji">👋</div>
    <h3>${PROFILE ? 'Ubah Nama & Kelas' : 'Sebelum mulai, kenalan dulu yuk!'}</h3>
    <p>Isi nama dan kelasmu supaya progres bacaan &amp; skormu tersimpan dengan benar.</p>
    <label>Nama Lengkap</label>
    <input type="text" class="gate-input" id="gate-nama" placeholder="Contoh: Andi Saputra" value="${PROFILE ? PROFILE.nama : ''}">
    <label>Kelas</label>
    <input type="text" class="gate-input" id="gate-kelas" placeholder="Contoh: 7A" value="${PROFILE ? PROFILE.kelas : ''}">
    <div class="btnrow">
      <button class="btn" id="gate-save">Mulai Membaca</button>
      ${PROFILE ? '<button class="btn ghost" id="gate-cancel">Batal</button>' : ''}
    </div>
  </div>`);
  wrap.querySelector('#gate-save').onclick = async ()=>{
    const nama = wrap.querySelector('#gate-nama').value;
    const kelas = wrap.querySelector('#gate-kelas').value;
    if(!nama.trim() || !kelas.trim()){
      showToast('⚠️ Isi nama dan kelas dulu, ya.');
      return;
    }
    const isFirstTime = !PROFILE;
    await saveProfile(nama, kelas);
    editingProfile = false;
    renderApp();
    speak(isFirstTime
      ? `Selamat datang, ${PROFILE.nama}! Yuk mulai membaca dan belajar bersama Satlit N 40.`
      : `Data berhasil diperbarui. Selamat belajar, ${PROFILE.nama}!`);
  };
  const cancelBtn = wrap.querySelector('#gate-cancel');
  if(cancelBtn) cancelBtn.onclick = ()=>{ editingProfile=false; renderApp(); };
  return wrap;
}

function renderProfilePill(){
  const p = el(`<div class="profile-pill">
    <span class="avatar">${PROFILE.nama.trim().charAt(0).toUpperCase() || '👤'}</span>
    <div class="pinfo"><b>${PROFILE.nama}</b><span>Kelas ${PROFILE.kelas}</span></div>
    <button class="pedit" title="Ubah nama & kelas">✏️ Ubah</button>
  </div>`);
  p.querySelector('.pedit').onclick = ()=>{ editingProfile=true; renderApp(); };
  return p;
}

function renderHero(){
  return el(`
  <div class="hero">
    <div class="hero-inner">
      <div class="hero-text">
        <span class="eyebrow"><span class="dot"></span>SATLIT N40 · Rabu &amp; Kamis</span>
        <h1>SATUAN LITERASI DAN NUMERASI<br>SMPN 40 SEMARANG</h1>
        <p>E-magazin mingguan SMP Negeri 40 Semarang — baca, jawab soal literasi &amp; numerasi, lalu refleksi. Satu edisi baru terbuka setiap kali edisi sebelumnya selesai.</p>
        <div class="hero-stats">
          <div class="stat"><b>${doneCount()}/${TOTAL_WEEKS}</b><span>Edisi selesai</span></div>
          <div class="stat"><b>${avgScore()}%</b><span>Skor rata-rata</span></div>
          <div class="stat"><b>${THEMES.length}</b><span>Tema bacaan</span></div>
        </div>
      </div>
      <div class="hero-visual">
        <div class="logo-card"><img src="${LOGO_IMG}" alt="Logo SATLIT N40"></div>
      </div>
    </div>
  </div>`);
}

function renderTabs(){
  const wrap = el(`<div class="tabs">
    <button class="tab ${currentTab==='beranda'?'active':''}" data-tab="beranda">🏠 Beranda</button>
    <button class="tab ${currentTab==='daftar'?'active':''}" data-tab="daftar">📚 Daftar Edisi</button>
  </div>`);
  wrap.querySelectorAll('.tab').forEach(b=>{
    b.onclick = ()=>{ currentTab=b.dataset.tab; openWeek=null; renderApp(); };
  });
  return wrap;
}

function renderBeranda(){
  const wrap = document.createElement('div');
  wrap.appendChild(el(`<div class="section-title"><h2>Kartu Stempel Mingguan</h2><span>Klik lingkaran untuk membuka edisi</span></div>`));
  const grid = el('<div class="passport"></div>');
  EDITIONS.forEach(ed=>{
    const theme = themeById(ed.themeId);
    const unlocked = isUnlocked(ed.week);
    const done = isDone(ed.week);
    const cls = done ? 'stamp done' : (unlocked ? 'stamp unlocked' : 'stamp locked');
    const s = el(`<div class="${cls}" style="--themecolor:${theme.color}" title="Minggu ${ed.week} · ${theme.name}">
        ${done ? '✓' : (unlocked ? theme.icon : '🔒')}
        <small>${ed.week}</small>
      </div>`);
    s.onclick = ()=> openEdition(ed.week);
    grid.appendChild(s);
  });
  wrap.appendChild(grid);
  return wrap;
}

function renderDaftar(){
  const wrap = document.createElement('div');
  wrap.appendChild(el(`<div class="section-title"><h2>Daftar Edisi</h2><span>${TOTAL_WEEKS} lembar · 1 tahun ajaran</span></div>`));
  const filters = el('<div class="filters"></div>');
  const allActive = currentFilter==='all';
  const allChip = el(`<button class="chip ${allActive?'active':''}" style="background:${allActive?'#FF6B4A':'#F1EFFB'};border-color:${allActive?'#FF6B4A':'#DCD6F7'};color:${allActive?'#fff':'#4B3F8C'}">🌈 Semua</button>`);
  allChip.onclick = ()=>{ currentFilter='all'; renderApp(); };
  filters.appendChild(allChip);
  THEMES.forEach(t=>{
    const active = currentFilter===t.id;
    const bg = active ? t.color : hexToRgba(t.color,.16);
    const border = active ? t.color : hexToRgba(t.color,.4);
    const c = el(`<button class="chip ${active?'active':''}" style="background:${bg};border-color:${border};color:#20233F">${t.icon} ${t.name}</button>`);
    c.onclick = ()=>{ currentFilter=t.id; renderApp(); };
    filters.appendChild(c);
  });
  wrap.appendChild(filters);

  const list = el('<div class="edlist"></div>');
  const filtered = EDITIONS.filter(ed => currentFilter==='all' || ed.themeId===currentFilter);
  filtered.forEach(ed=>{
    const theme = themeById(ed.themeId);
    const unlocked = isUnlocked(ed.week);
    const done = isDone(ed.week);
    let statusHtml;
    if(done) statusHtml = `<span class="status st-done">✓ ${PROGRESS[ed.week].score}%</span>`;
    else if(unlocked) statusHtml = `<span class="status st-open">Terbuka</span>`;
    else statusHtml = `<span class="status st-lock">🔒 Terkunci</span>`;
    const row = el(`<div class="edrow" style="border-left:4px solid ${theme.color};${unlocked?'cursor:pointer':'opacity:.65'}">
      <div class="badge" style="background:${theme.color}">${theme.icon}</div>
      <div class="meta"><b>Minggu ${ed.week} · ${ed.title}</b><span>${theme.name}</span></div>
      ${statusHtml}
    </div>`);
    row.onclick = ()=> openEdition(ed.week);
    list.appendChild(row);
  });
  wrap.appendChild(list);
  return wrap;
}

function openEdition(week){
  const ed = EDITIONS[week-1];
  if(!isUnlocked(week)){
    showToast('🔒 Selesaikan edisi Minggu '+(week-1)+' dulu untuk membuka edisi ini.');
    return;
  }
  if(ed.draft){
    showToast('📝 Materi edisi ini sedang disiapkan oleh Koordinator SATLIT.');
    return;
  }
  openWeek = week;
  quizState = { lit:[null,null], num:'', refl:[''] };
  renderApp();
  window.scrollTo({top:0,behavior:'smooth'});
  const ed2 = EDITIONS[week-1];
  if(!isDone(week)) speak(`Selamat membaca edisi minggu ${week}, ${ed2.title}. Semangat belajar!`);
}

function renderReader(week){
  const ed = EDITIONS[week-1];
  const c = ed.content;
  const theme = themeById(ed.themeId);
  const done = isDone(week);
  const wrap = el(`<div></div>`);
  const back = el(`<button class="btn ghost" style="margin-bottom:16px">← Kembali</button>`);
  back.onclick = ()=>{ openWeek=null; renderApp(); };
  wrap.appendChild(back);

  const reader = el(`<div class="reader"></div>`);
  reader.appendChild(el(themeIllustration(ed.themeId)));
  reader.appendChild(el(`<span class="tag" style="background:${theme.color}">${theme.icon} ${theme.name} · Minggu ${week}</span>`));
  reader.appendChild(el(`<h2>${c.title}</h2>`));
  reader.appendChild(el(`<div class="sub">Bacaan literasi-numerasi mingguan</div>`));
  c.paras.forEach(p=> reader.appendChild(el(`<p>${p}</p>`)));
  reader.appendChild(el('<hr class="divider">'));

  if(done){
    const res = PROGRESS[week];
    reader.appendChild(el(`<div class="result"><b>${res.score}%</b><div style="color:var(--muted);font-size:13px;margin-top:4px">Edisi ini sudah kamu selesaikan. Kerja bagus! 🎉</div></div>`));
    wrap.appendChild(reader);
    return wrap;
  }

  // Literacy questions
  c.lit.forEach((q,qi)=>{
    const qb = el(`<div class="q-block"><div class="qlabel">Soal Literasi ${qi+1}</div><div class="q-text">${q.q}</div><div class="opts"></div></div>`);
    const optsWrap = qb.querySelector('.opts');
    q.opts.forEach((o,oi)=>{
      const ob = el(`<button class="opt" type="button">${String.fromCharCode(65+oi)}. ${o}</button>`);
      ob.onclick = ()=>{
        quizState.lit[qi]=oi;
        optsWrap.querySelectorAll('.opt').forEach((n,ni)=> n.classList.toggle('sel', ni===oi));
      };
      optsWrap.appendChild(ob);
    });
    reader.appendChild(qb);
  });

  // Numeracy
  const nb = el(`<div class="q-block"><div class="qlabel">Soal Numerasi</div><div class="q-text">${c.num.q}</div></div>`);
  const numInput = el(`<input class="numin" type="number" placeholder="Jawabanmu">`);
  numInput.oninput = (e)=>{ quizState.num = e.target.value; };
  nb.appendChild(numInput);
  reader.appendChild(nb);

  reader.appendChild(el('<hr class="divider">'));

  // Reflection
  const reflWrap = el(`<div class="q-block refl"><div class="qlabel">Refleksi &amp; Umpan Balik</div></div>`);
  reflWrap.appendChild(el(`<label>Apa hal yang paling menarik atau baru yang kamu pelajari dari bacaan ini?</label>`));
  const ta = el(`<textarea placeholder="Tulis refleksimu di sini..."></textarea>`);
  ta.oninput = (e)=>{ quizState.refl[0] = e.target.value; };
  reflWrap.appendChild(ta);
  reader.appendChild(reflWrap);

  const btnrow = el(`<div class="btnrow"></div>`);
  const submitBtn = el(`<button class="btn">Selesai &amp; Kirim Jawaban</button>`);
  submitBtn.onclick = ()=> submitEdition(week);
  btnrow.appendChild(submitBtn);
  reader.appendChild(btnrow);

  wrap.appendChild(reader);
  return wrap;
}

async function submitEdition(week){
  const ed = EDITIONS[week-1];
  const c = ed.content;
  if(quizState.lit.includes(null) || quizState.num===''){
    showToast('⚠️ Jawab semua soal literasi & numerasi dulu, ya.');
    return;
  }
  let correct = 0;
  c.lit.forEach((q,qi)=>{ if(quizState.lit[qi]===q.ans) correct++; });
  if(parseFloat(quizState.num)===c.num.ans) correct++;
  const score = Math.round((correct/3)*100);

  PROGRESS[week] = { done:true, score, reflections: quizState.refl.slice(), ts: Date.now() };
  await saveProgress();
  showToast('✅ Edisi Minggu '+week+' selesai — skor '+score+'%. Edisi berikutnya terbuka!');
  renderApp();
  speak(praiseForScore(score));
}

function renderFooter(){
  const f = el(`<div class="footer-note">
    <span>SATLIT N40 · Program Literasi &amp; Numerasi SMPN 40 Semarang</span>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="sound-toggle" id="sound-toggle">${SOUND_ON ? '🔊 Suara aktif' : '🔇 Suara nonaktif'}</button>
      <button class="reset-btn">Reset progres saya</button>
    </div>
  </div>`);
  f.querySelector('#sound-toggle').onclick = ()=>{
    SOUND_ON = !SOUND_ON;
    if(!SOUND_ON && 'speechSynthesis' in window) window.speechSynthesis.cancel();
    renderApp();
    if(SOUND_ON) speak('Suara diaktifkan.');
  };
  f.querySelector('.reset-btn').onclick = async ()=>{
    if(confirm('Hapus semua progres bacaan & skor kamu? Tindakan ini tidak bisa dibatalkan.')){
      PROGRESS = {};
      await saveProgress();
      openWeek=null;
      renderApp();
      speak('Progresmu sudah direset. Terima kasih sudah belajar bersama Satlit N 40, semangat mulai lagi ya!');
    }
  };
  return f;
}

/* ---------------- INIT ---------------- */
(async function init(){
  document.getElementById('app').innerHTML = '<div style="padding:60px;text-align:center;color:#9A9FD1">Memuat progres...</div>';
  await loadProgress();
  await loadProfile();
  renderApp();
  if(PROFILE && !hasGreetedThisSession){
    hasGreetedThisSession = true;
    setTimeout(()=> speak(`Selamat datang kembali, ${PROFILE.nama}! Semangat belajar hari ini.`), 400);
  }
})();
</script>
